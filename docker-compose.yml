version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ecom-analytics
      - JWT_SECRET=dev-secret-change-me
      - NODE_ENV=development
    depends_on:
      - mongo

volumes:
  mongo-data:
